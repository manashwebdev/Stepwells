.bg2{background:radial-gradient(ellipse 70% 55% at 50% 105%,#4a2a0a 0,#06070f 72%);opacity:0}
.beam{position:fixed;top:0;left:50%;width:46vmin;height:100%;margin-left:-23vmin;pointer-events:none;mix-blend-mode:screen;filter:blur(18px);
background:linear-gradient(#ffc36b99,#ff9f4a22 60%,transparent);clip-path:polygon(32% 0,68% 0,100% 100%,0 100%)}
.mote{position:fixed;width:3px;height:3px;border-radius:50%;background:#ffd9a0;opacity:.5;pointer-events:none;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(18px,-34px);opacity:.15}}
.hud{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 18px 12px;
background:linear-gradient(rgba(8,9,30,.85),transparent)}
.hud b{font-family:Syne,sans-serif;font-size:15px}
.hud div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,214,150,.4);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500}
.btn:hover,.btn[aria-pressed=true]{background:rgba(255,179,71,.25);box-shadow:0 0 16px rgba(255,179,71,.4)}
:focus-visible{outline:3px solid var(--amb);outline-offset:3px}
.depth{font-size:14px;color:var(--sand);font-variant-numeric:tabular-nums;min-width:88px;text-align:right}
.dots{position:fixed;z-index:50;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;border:1.5px solid var(--sand);background:transparent}
.dots button.on{background:var(--amb);box-shadow:0 0 12px var(--amb);border-color:var(--amb)}
#spacer{width:1px}
.scene{position:fixed;inset:0;perspective:1100px;overflow:hidden}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.panel{position:absolute;left:50%;top:50%;width:min(940px,90vw);max-height:80vh;overflow:auto;padding:28px 32px;border-radius:26px;
background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
border:1px solid rgba(255,214,150,.28);box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 60px rgba(255,160,60,.12),inset 0 1px 0 rgba(255,255,255,.15);will-change:transform,opacity,filter}
.eyebrow{margin:0 0 6px;color:var(--amb);font-weight:700;font-size:14px}
h2{font-size:clamp(28px,4.4vw,46px);margin-bottom:6px}
.yr{margin:0 0 14px;color:var(--sand);font-weight:500}
dl{margin:0;display:grid;gap:10px}dt{font-weight:700;color:var(--amb);font-size:14px}dd{margin:0;color:var(--ink);max-width:62ch}
.well{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center}
.art{border-radius:18px;overflow:hidden;border:1px solid rgba(255,214,150,.3);box-shadow:0 0 40px rgba(255,160,60,.18)}
.art svg,.art img{display:block;width:100%;height:auto}.art{position:relative}.art img{aspect-ratio:4/3;object-fit:cover;transform:translate(calc(var(--mx)*-9px),calc(var(--my)*-6px)) scale(1.07)}.art figcaption{position:absolute;left:10px;bottom:8px;padding:3px 10px;border-radius:99px;background:rgba(8,9,30,.7);color:var(--ink);font-size:12px;backdrop-filter:blur(6px)}
.layer{transform:translate(calc(var(--mx)*var(--d)*1px),calc(var(--my)*var(--d)*.6px))}
.hero{text-align:center;padding:36px 32px}
.hero h1{font-size:clamp(36px,6.4vw,78px);font-weight:800;text-shadow:0 0 40px rgba(255,179,71,.45)}
.hero p{max-width:50ch;margin:18px auto 26px;color:var(--mut);font-size:19px}
.cta{background:linear-gradient(135deg,#ffb347,#e0793a);color:#1a0f05;font-weight:700;border:0;border-radius:99px;padding:14px 30px;box-shadow:0 0 30px rgba(255,160,60,.55)}
.mapwrap{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;align-items:center}
.mapwrap svg{width:100%;height:auto;border-radius:12px;border:1px solid rgba(255,214,150,.45);box-shadow:0 0 40px rgba(255,160,60,.22)}
.pin{cursor:pointer}.pin .dot{fill:#9b2d1c;stroke:#f6e2b0;stroke-width:2}.pin .ring{fill:none;stroke:#9b2d1c;stroke-opacity:.6;transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-out infinite}.pin text{font:700 13px 'Hanken Grotesk',sans-serif;fill:#2e1808;paint-order:stroke;stroke:#f0d9a8;stroke-width:3.5px;stroke-linejoin:round}.pin:hover .dot,.pin:focus-visible .dot{fill:#d4471f}@keyframes pl{from{transform:scale(.6);opacity:1}to{transform:scale(1.9);opacity:0}}@media(prefers-reduced-motion:reduce){.pin .ring{animation:none}}
.tl{list-style:none;margin:16px 0 0;padding:0 0 0 22px;border-left:2px solid var(--amb);display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;box-shadow:-8px 0 20px -12px var(--amb)}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-29px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--amb);box-shadow:0 0 10px var(--amb)}
.tl b{display:block;color:var(--sand)}.tl span{color:var(--ink)}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.tips div{background:rgba(255,255,255,.07);border:1px solid rgba(255,214,150,.22);border-radius:16px;padding:14px 16px}
.tips b{display:block;color:var(--amb)}
@media(max-width:760px){.well,.mapwrap,.tl,.tips{grid-template-columns:1fr}.panel{padding:20px 18px}.dots{display:none}.hud b{display:none}}
/* 2D fallback */
body.flat .scene{position:static;perspective:none;overflow:visible}
body.flat .world{position:static;transform:none!important;padding:84px 0 40px}
body.flat .panel{position:relative;left:auto;top:auto;transform:none!important;opacity:1!important;filter:none!important;visibility:visible!important;pointer-events:auto!important;max-height:none;margin:0 auto 26px;background:rgba(24,26,72,.85)}
body.flat #spacer,body.flat .beam,body.flat .dots{display:none}
body.flat .bg2{opacity:.5}
/* ancient theme */
:root{--ink:#f3dfb4;--mut:#d9c49a;--amb:#e8b04a;--sand:#d9b06a;--bg:#150b05}
.bg1{background:radial-gradient(ellipse 90% 60% at 50% 0,#7a5632 0,#3d2815 45%,#150b05 100%)}
.bg2{background:radial-gradient(ellipse 70% 55% at 50% 105%,#6a2e0c 0,#080402 72%)}
.beam{background:linear-gradient(#ffd98a99,#e8a64a22 60%,transparent)}
.hud{background:linear-gradient(rgba(16,8,3,.9),transparent)}
.btn{background:rgba(255,230,180,.12);border-color:rgba(232,190,120,.55)}
.btn:hover,.btn[aria-pressed=true]{background:rgba(232,176,74,.28);box-shadow:0 0 16px rgba(232,176,74,.4)}
.panel{color:#2b1708;background:linear-gradient(160deg,rgba(240,217,168,.96),rgba(210,174,112,.94));border:1px solid rgba(90,55,20,.65);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 50px rgba(255,190,90,.2),inset 0 0 70px rgba(120,70,20,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;mix-blend-mode:multiply;opacity:.6;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .17 0 0 0 0 .05 0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.panel h1,.panel h2{color:#2e1808}
.eyebrow,dt,.tips b{color:#8b2a1a}
.yr{color:#7a4a1c}
dd,.tl span{color:#2b1708}
.hero h1{text-shadow:0 2px 0 rgba(255,244,210,.6)}
.hero p{color:#4a2c12}
.cta{background:linear-gradient(135deg,#a8321f,#6e1d10);color:#f6e2b0;box-shadow:0 0 28px rgba(168,50,31,.5)}
.art{border-color:rgba(90,55,20,.55);box-shadow:0 6px 24px rgba(60,30,8,.4)}
.tl{border-left-color:#8b2a1a;box-shadow:none}.tl li::before{background:#8b2a1a;box-shadow:0 0 8px rgba(139,42,26,.6)}.tl b{color:#6e3b12}
.tips div{background:rgba(255,248,225,.5);border-color:rgba(110,70,30,.4)}
body.flat .panel{background:linear-gradient(160deg,rgba(240,217,168,.97),rgba(210,174,112,.95))}
.panel :focus-visible,.panel:focus-visible{outline-color:#8b2a1a}

const clamp=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
const rm=matchMedia("(prefers-reduced-motion: reduce)");
let t=0,tt=0,tx=0,ty=0,ttx=0,tty=0,pr=0;
function setFlat(f){body.classList.toggle("flat",f);document.getElementById("flat").setAttribute("aria-pressed",f);document.getElementById("flat").textContent=f?"3D view":"2D view";
document.getElementById("spacer").style.height=f?"0":((N-1)*90+100)+"vh";if(!f)els.forEach(e=>e.style.cssText="")}
function cur(){return clamp(Math.round(t),0,N-1)}
function go(i){i=clamp(i,0,N-1);const sm=rm.matches?"auto":"smooth";
if(body.classList.contains("flat"))els[i].scrollIntoView({behavior:sm,block:"start"});else{const m=root.scrollHeight-innerHeight;scrollTo({top:i/(N-1)*m,behavior:sm})}}
function frame(){const flat=body.classList.contains("flat");
if(!flat){const m=root.scrollHeight-innerHeight;tt=m>0?scrollY/m*(N-1):0;t+=(tt-t)*(rm.matches?1:.09);tx+=(ttx-tx)*.07;ty+=(tty-ty)*.07;
world.style.transform=`rotateX(${(-ty*4).toFixed(2)}deg) rotateY(${(tx*6).toFixed(2)}deg)`;root.style.setProperty("--mx",tx.toFixed(3));root.style.setProperty("--my",ty.toFixed(3));
els.forEach((e,i)=>{const d=i-t;const o=clamp(d<0?1+d*1.7:1-d*.36,0,1),b=d>0?Math.min(9,d*3.2):Math.min(10,-d*9);
const y=d>0?-d*230:-d*140,x=(i%2?1:-1)*Math.max(0,d)*90;
e.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${-d*680}px)`;e.style.opacity=o.toFixed(3);e.style.filter=b>.2?`blur(${b.toFixed(1)}px)`:"none";
e.style.visibility=o<.02?"hidden":"visible";e.style.pointerEvents=Math.abs(d)<.5?"auto":"none"});
pr=t/(N-1);document.querySelector(".bg2").style.opacity=pr;document.querySelector(".beam").style.opacity=(.9-pr*.75).toFixed(2);dep.textContent="Depth "+Math.round(pr*27)+" m"}
else{dep.textContent="";}
db.forEach((b,i)=>b.classList.toggle("on",i==cur()));
if(lp&&ac)lp.frequency.setTargetAtTime(1500-pr*1280,ac.currentTime,.3);
requestAnimationFrame(frame)}
/* audio: synthesised drone and drips, deeper and lower as you descend */
let ac,lp,master,ds,on=false;
function drip(){if(!on)return;const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=950-pr*520+Math.random()*180;
g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.2,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.35);
o.connect(g).connect(ds);o.start();o.stop(ac.currentTime+.4);setTimeout(drip,1400+Math.random()*2400*(1.2-pr*.5))}
function sound(v){const b=document.getElementById("snd");
if(v&&!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1500;
[[55,"sawtooth",.15],[82.4,"sine",.5],[110.6,"sine",.3],[164.8,"triangle",.08]].forEach(([f,ty,gv])=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=f;const g=ac.createGain();g.gain.value=gv;o.connect(g).connect(lp);o.start()});
const dl=ac.createDelay();dl.delayTime.value=.45;const fb=ac.createGain();fb.gain.value=.5;dl.connect(fb);fb.connect(dl);ds=ac.createGain();ds.gain.value=.5;ds.connect(ac.destination);ds.connect(dl);dl.connect(ac.destination);lp.connect(master);master.connect(ac.destination)}
on=v;b.setAttribute("aria-pressed",v);b.textContent=v?"Sound on":"Sound off";if(!ac)return;
if(v){ac.resume();master.gain.setTargetAtTime(.14,ac.currentTime,.6);drip()}else master.gain.setTargetAtTime(0,ac.currentTime,.3)}
document.getElementById("snd").onclick=()=>sound(!on);
document.getElementById("flat").onclick=()=>setFlat(!body.classList.contains("flat"));
db.forEach((b,i)=>b.onclick=()=>go(i));
body.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(+g.dataset.go)});
body.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("[data-go]");if(g&&(e.key=="Enter"||e.key==" ")){e.preventDefault();go(+g.dataset.go);return}
if(body.classList.contains("flat"))return;const k=e.key;
if(k=="ArrowDown"||k=="PageDown"){e.preventDefault();go(cur()+1)}else if(k=="ArrowUp"||k=="PageUp"){e.preventDefault();go(cur()-1)}else if(k=="Home"){e.preventDefault();go(0)}else if(k=="End"){e.preventDefault();go(N-1)}});
els.forEach((e,i)=>e.addEventListener("focusin",()=>{if(!body.classList.contains("flat")&&Math.abs(i-t)>.6)go(i)}));
addEventListener("pointermove",e=>{ttx=e.clientX/innerWidth*2-1;tty=e.clientY/innerHeight*2-1});
addEventListener("deviceorientation",e=>{if(e.gamma==null)return;ttx=clamp(e.gamma/25);tty=clamp((e.beta-50)/25)});
rm.addEventListener&&rm.addEventListener("change",()=>setFlat(rm.matches));
setFlat(rm.matches);frame();
</script></body></html>
